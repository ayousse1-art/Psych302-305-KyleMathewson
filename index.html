<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #102a43;
      color: #f6f1e6;
    }
    .card {
      background: #243b53;
      padding: 28px 32px;
      border-radius: 30px;
      text-align: center;
      max-width: 420px;
    }
    button {
      background: #7cc4b8;
      color: #1c1408;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, I am a Ahmad Youssef </h1>
    <p>I am in my final year of undergrad in Psychology Specialization </p>
    <p id="detail">I am an athete, and aspire to become a dentist </p>
    <button id="more">Discover a fun fact about me</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
    "Fun fact: I speak both English and Arabic!";
button.textContent = "You found it!";
    });
  </script>
</body>
</html>
