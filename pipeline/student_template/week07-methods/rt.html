<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Week 7 Stroop starter · PSYCH 302 / 305</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <style>
      html, body { margin: 0; background: #0b0f14; color: #f3efe6; font-family: Georgia, serif; }
      p { max-width: 640px; margin: 16px auto; color: #b7b1a4; padding: 0 16px; }
      a { color: #e8b86d; }
      canvas { display: block; margin: 0 auto 24px; }
    </style>
  </head>
  <body>
    <p>
      Week 7 starter: this is the Week 2 reaction-time task, unchanged.
      Turn it into the Stroop task your Methods describes (Part 1 on
      <a href="https://kylemath.github.io/Psych302-305-KyleMathewson/methods.html">methods.html</a>).
      Serve this folder with <code>python3 -m http.server 8765</code> and open
      <code>http://127.0.0.1:8765/rt.html</code>. Save the CSV as
      <code>stroop-week07.csv</code> in this folder.
    </p>
    <script>
// Week 7: start here. This is the Week 2 sketch. Make it the Stroop task
// in your Methods, then reload the page after each edit.
let nTrials = 20;
let markSize = 72;
let markColor = [232, 184, 109];
const colors = {
  red: [255, 0, 0],
  blue: [0, 0, 255],
  green: [0, 128, 0],
  yellow: [255, 255, 0]
};

const responseKeys = {
  z: "red",
  x: "blue",
  n: "green",
  m: "yellow"
};

let trials = [];
let currentWord = "";
let currentInk = [255, 0, 0];
let currentCondition = "";
let currentCorrectColor = "";
let delayMin = 800;
let delayMax = 2200;
let rtMin = 150;
let rtMax = 2500;

let state = "idle";
let trial = 0;
let nWanted = 20;
let onset = 0;
let waitUntil = 0;
let itiUntil = 0;
let results = [];
let note = "Click Start. Then space or click when the square appears.";

function fitWidth() {
  return Math.max(320, Math.min(640, windowWidth));
}
function makeTrials() {
  const words = ["red", "blue", "green", "yellow"];
  const list = [];

  for (let i = 0; i < 10; i++) {
    const color = words[i % words.length];

    list.push({
      word: color,
      ink: color,
      condition: "congruent"
    });

    const otherColors = words.filter(c => c !== color);
    const differentInk =
      otherColors[Math.floor(Math.random() * otherColors.length)];

    list.push({
      word: color,
      ink: differentInk,
      condition: "incongruent"
    });
  }

  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }

  return list;
}
function setup() {
  createCanvas(fitWidth(), 420);
  textFont("system-ui, sans-serif");
}

function windowResized() {
  resizeCanvas(fitWidth(), 420);
}

function draw() {
  background(7, 9, 13);

  if (state === "wait" && millis() >= waitUntil) {
    state = "show";
    onset = millis();
  }
  if (state === "iti" && millis() >= itiUntil) {
    beginTrial();
  }

  if (state === "wait") {
    fill(183, 177, 164);
    textAlign(CENTER, CENTER);
    textSize(48);
    text("+", width / 2, height / 2 + 10);
 } else if (state === "show") {
  noStroke();
  textAlign(CENTER, CENTER);
  textSize(48);
  fill(currentInk[0], currentInk[1], currentInk[2]);
  text(currentWord, width / 2, height / 2 + 10);
}
  textAlign(LEFT, TOP);
  textSize(14);
  fill(183, 177, 164);
  text(note, 16, 16);
  text(progressLabel(), 16, 36);
  text(statsLabel(), 16, 56);
  drawButtons();
}

function progressLabel() {
  if (state === "idle") return "Ready";
  if (state === "done") return nWanted + " / " + nWanted;
  return trial + " / " + nWanted;
}

function statsLabel() {
  const good = results.filter((row) => row.usable && !row.practice);
  if (!good.length) return "n = 0   mean = —   SD = —";
  const xs = good.map((row) => row.rt);
  const m = xs.reduce((a, b) => a + b, 0) / xs.length;
  let sd = "—";
  if (xs.length > 1) {
    const v = xs.reduce((a, x) => a + (x - m) * (x - m), 0) / (xs.length - 1);
    sd = String(Math.round(Math.sqrt(v)));
  }
  return "n = " + good.length + "   mean = " + Math.round(m) + " ms   SD = " + sd + " ms";
}

function btnW() {
  return Math.min(130, (width - 48) / 3);
}

function drawButtons() {
  const bw = btnW();
  pill(16, height - 52, bw, 36, "Start " + nTrials);
  pill(16 + bw + 10, height - 52, bw, 36, "Practice 6");
  pill(16 + 2 * (bw + 10), height - 52, bw, 36, "Export CSV");
}

function pill(x, y, w, h, label) {
  const over = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
  fill(over ? 232 : 40, over ? 184 : 44, over ? 109 : 52);
  rect(x, y, w, h, 8);
  fill(over ? 28 : 243, over ? 20 : 239, over ? 8 : 230);
  textAlign(CENTER, CENTER);
  textSize(14);
  text(label, x + w / 2, y + h / 2);
  textAlign(LEFT, TOP);
}

function hitButtons() {
  const bw = btnW();
  if (mouseY < height - 52 || mouseY > height - 16) return null;
  if (mouseX >= 16 && mouseX <= 16 + bw) return "start";
  if (mouseX >= 16 + bw + 10 && mouseX <= 16 + 2 * bw + 10) return "practice";
  if (mouseX >= 16 + 2 * (bw + 10) && mouseX <= 16 + 3 * bw + 20) return "export";
  return null;
}

function mousePressed() {
  const hit = hitButtons();

  if (hit === "start") {
    startBlock(nTrials);
    return;
  }

  if (hit === "practice") {
    startBlock(6);
    return;
  }

  if (hit === "export") {
    exportCsv();
    return;
  }

  handleResponse();
}
function keyPressed() {
  const pressed = key.toLowerCase();

  if (["z", "x", "n", "m"].includes(pressed)) {
    handleResponse(pressed);
    return false;
  }

  if (key === " ") {
    handleResponse(null);
    return false;
  }
}
function startBlock(n) {
  nWanted = n;
  results = [];
  trial = 0;
  note = "Identify ink colour: Z = Red, X = Blue, N = Green, M = Yellow.";
  trials = makeTrials();
  beginTrial();
}
function beginTrial() {
  trial += 1;

  if (trial > nWanted) {
    state = "done";
    note = "Block finished. Export the CSV.";
    return;
  }

  const item = trials[trial - 1];

  currentWord = item.word;
  currentInk = colors[item.ink];
  currentCondition = item.condition;
  currentCorrectColor = item.ink;

  state = "wait";
  note = "Ink colour: Z=Red X=Blue N=Green M=Yellow";
  waitUntil = millis() + random(delayMin, delayMax);
}

function handleResponse(pressedKey) {
  if (state === "wait") {
    results.push({
      trial: trial,
      word: currentWord,
      ink: currentCorrectColor,
      condition: currentCondition,
      response_key: pressedKey || "",
      rt: 0,
      correct: 0,
      usable: 0,
      anticipation: 1,
      practice: nWanted <= 6 ? 1 : 0
    });

    note = "Too early. Stored as an anticipation.";
    state = "iti";
    itiUntil = millis() + 550;
    return;
  }

  if (state !== "show" || !pressedKey) return;

  const rt = Math.round(millis() - onset);
  const usable = rt >= rtMin && rt <= rtMax ? 1 : 0;
  const correct = responseKeys[pressedKey] === currentCorrectColor ? 1 : 0;

  results.push({
    trial: trial,
    word: currentWord,
    ink: currentCorrectColor,
    condition: currentCondition,
    response_key: pressedKey,
    rt: rt,
    correct: correct,
    usable: usable,
    anticipation: 0,
    practice: nWanted <= 6 ? 1 : 0
  });

  if (!usable) {
    note = "Reaction time outside the 150–2500 ms range.";
  } else if (!correct) {
    note = "Incorrect colour. Try to respond accurately.";
  } else {
    note = rt + " ms";
  }

  state = "iti";
  itiUntil = millis() + 550;
}
function exportCsv() {
  if (!results.length) {
    note = "No trials to export yet.";
    return;
  }

  const header =
    "trial,word,ink,condition,response_key,rt,correct,usable,anticipation,practice";

  const lines = results.map(row =>
    [
      row.trial,
      row.word,
      row.ink,
      row.condition,
      row.response_key,
      row.rt,
      row.correct,
      row.usable,
      row.anticipation,
      row.practice
    ].join(",")
  );

  const blob = new Blob(
    [header + "\n" + lines.join("\n") + "\n"],
    { type: "text/csv" }
  );

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "stroop-week07.csv";
  a.click();
  URL.revokeObjectURL(a.href);

  note = "CSV downloaded. Save it in week07-methods/.";
}
    </script>
  </body>
</html>
